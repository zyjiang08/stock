services:
  web:
    image: 9sig-backtest-web:${RELEASE_ID:-local}
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${BIND_IP:-192.168.124.107}:${PORT:-8910}:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
